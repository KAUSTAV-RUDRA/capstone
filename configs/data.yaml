# Data / corpus configuration.

buckets: [en, hi, te, cm]

# Frozen split (non-negotiable #6): written once, never regenerated.
splits_file: data/processed/splits.json
splits:
  train: 0.6
  cal: 0.2
  test: 0.2

# Minimum human counts per bucket (locked §5).
min_human_calibration_per_bucket: 1000
min_human_train_test_per_bucket: 1500

# Held-outs (non-negotiable #4): 2 unseen generators + 1 domain, test only.
heldout_generators: [llama, phi]   # aliases from machine_corpus.generators below
heldout_domain: null

# Adversarial attack families (matches RAID/DetectRL practice).
attack_types: [clean, paraphrase, back_translation, hybrid]

# Writer L1/L2 bands for the fairness audit (T5).
writer_l1_bands: [general, indian, native, unknown]   # en: general = L1 proxy, indian = Indian-English (L2 proxy); hi/te/cm: native

# Per-sample schema (docs/project-context-master.md §6).
schema_fields:
  - id
  - text
  - label
  - language
  - code_mix_ratio
  - generator
  - domain
  - length_tokens
  - attack_type
  - writer_L1_band
  - split

sources:
  benchmarks:
    - m4gt_bench      # primary multilingual
    - raid            # adversarial subsets
    - hc3             # smoke tests
  human:
    - indiccorp
    - ai4bharat_catalog
    - hinge
    - comi_lingua
    - l3cube
    - indian_student_essays
    - toefl_l2

# --- Human corpus builder (src/data/build_human_corpus.py; docs/parts-plan.md Parts 1-3) ---
# python -m src.data.build_human_corpus --bucket en --target 2200 --config configs/data.yaml
# Sources per band are pulled in order; max_share caps one source's slice of the
# band target so later sources still contribute. All en sources are pre-2022.
human_corpus:
  output_dir: data/raw/human
  passage_words: {min: 120, max: 300}       # one passage per source doc, cut at a sentence boundary
  # Every source is calibration_eligible unless it says otherwise. A source that
  # is NOT eligible is barred from the `cal` split by freeze_splits and routed to
  # train/test: the conformal guarantee is only as good as the certainty that the
  # calibration text is human (see decisions.md 2026-09-13).
  calibration_eligible_default: true
  dedup: {num_perm: 128, threshold: 0.8, shingle_words: 5}   # MinHash LSH over word 5-grams
  buckets:
    en:
      bands:
        general:            # general human English (L1 proxy for the T5 fairness split)
          share: 0.5
          sources:
            - name: hc3
              max_share: 0.55
              subsets: [reddit_eli5, open_qa, wiki_csai]
              provenance: "HC3 human answers (Guo et al. 2023; Hello-SimpleAI/HC3): ELI5 Reddit 2011-2019, WikiQA 2015, Wikipedia CS/AI intros <=2022; CC-BY-SA-4.0"
            - name: wikipedia
              max_share: 1.0
              config: 20231101.en
              max_page_id: 2000000        # page ids <= 2M were created before mid-2005 (pre-2020 proxy; text as of the 2023-11-01 dump)
              domain: wiki_general
              provenance: "wikimedia/wikipedia 20231101.en, page id <= 2,000,000 (article created <= 2005); CC-BY-SA-4.0"
        indian:             # Indian-English writers (L2 proxy for the T5 fairness split)
          share: 0.5
          sources:
            - name: samanantar_en
              max_share: 1.0
              configs: [hi]               # English side of the en-hi pairs (10.1M rows)
              domain: news_gov_mixed
              provenance: "ai4bharat/samanantar v0.3 (2021), English side of en-hi pairs: shuffled sentences from Indian news / PIB / PMIndia <=2020, regrouped into passages; CC-BY-NC-4.0"
    # hi / te: first-language writers, so a single band. IndicCorpV2 is capped
    # at 0.75 of the bucket so wikipedia contributes the remaining ~25%: that
    # gives hi/te a news + encyclopedic mix instead of pure news, which keeps
    # the domain profile closer to en's and stops a per-bucket result from
    # being partly a domain artefact. `script` keeps the bucket monolingual,
    # which per-language calibration depends on.
    hi:
      bands:
        native:
          share: 1.0
          sources:
            - name: indiccorp_v2
              max_share: 0.75           # leave ~25% of the bucket for wikipedia (domain blend)
              split: hin_Deva           # NOT a per-language config: one config, language = split
              max_docs: 120000          # only ~7% of docs yield a 120-300 word passage
              script: deva
              min_script_ratio: 0.8
              domain: news_web
              provenance: "ai4bharat/IndicCorpV2 (Doddapaneni et al., ACL 2023), split hin_Deva: crawled Indian news/web Hindi, crawl <=2022; CC-0"
            - name: wikipedia
              max_share: 1.0
              config: 20231101.hi
              max_page_id: 100000       # early-created articles (pre-2020 proxy)
              script: deva
              min_script_ratio: 0.8
              domain: wiki_general
              provenance: "wikimedia/wikipedia 20231101.hi, page id <= 100,000; CC-BY-SA-4.0"
    te:
      bands:
        native:
          share: 1.0
          sources:
            - name: indiccorp_v2
              max_share: 0.75           # leave ~25% of the bucket for wikipedia (domain blend)
              split: tel_Telu
              max_docs: 400000          # only ~2% of Telugu docs are long enough
              script: telu
              min_script_ratio: 0.8
              domain: news_web
              provenance: "ai4bharat/IndicCorpV2 (Doddapaneni et al., ACL 2023), split tel_Telu: crawled Indian news/web Telugu, crawl <=2022; CC-0"
            - name: wikipedia
              max_share: 1.0
              config: 20231101.te
              max_page_id: 100000
              script: telu
              min_script_ratio: 0.8
              domain: wiki_general
              provenance: "wikimedia/wikipedia 20231101.te, page id <= 100,000; CC-BY-SA-4.0"
    # cm: Romanised (Latin-script) Hindi-English code-mixing. Hinglish occurs as
    # comments, chat turns and single sentences, so this bucket overrides the
    # global passage length - a 120-word floor would reject nearly all of it.
    # `min_hindi_word_ratio` is the bucket's real gate: it separates genuine
    # code-mixing from the English-only rows that sit in the same source files,
    # and its value is stored per row as `code_mix_ratio`.
    cm:
      passage_words: {min: 15, max: 300}
      bands:
        native:
          share: 1.0
          sources:
            # Pre-ChatGPT sources first, so as much of the bucket as possible
            # has provenance that rules out machine text (see decisions.md).
            - name: hinge
              max_share: 1.0
              split: train
              column: "Human-generated Hinglish"
              script: latn
              min_script_ratio: 0.9
              min_hindi_word_ratio: 0.3
              domain: hinglish_generation
              provenance: "LingoIITGN/HinGE (Srivastava & Singh, 2021): human-written Hinglish for Hindi-English sentence pairs, pre-ChatGPT; CC-BY-4.0"
            - name: cmu_hinglish_dog
              max_share: 1.0
              splits: [train, validation, test]
              script: latn
              min_script_ratio: 0.9
              min_hindi_word_ratio: 0.3
              domain: chat_dialogue
              provenance: "festvox/cmu_hinglish_dog (Zhou et al. 2018; Hinglish version 2020): two-person chat about film articles, utterances joined per conversation, pre-ChatGPT; CC-BY-SA-3.0"
            - name: comi_lingua
              max_share: 1.0
              calibration_eligible: false   # no stated collection date -> cannot rule out machine text
              config: TN              # the only Roman-script config; others are Devanagari
              splits: [train, test]
              column: Sentences       # raw comment, NOT the annotator-normalised columns
              script: latn
              min_script_ratio: 0.9
              min_hindi_word_ratio: 0.3
              domain: social_comments
              provenance: "LingoIITGN/COMI-LINGUA (Sheth et al., 2025) TN config, raw Sentences: naturally-written Roman-script Hinglish social comments; collection date not stated, so post-2022 machine text cannot be ruled out; CC-BY-4.0"

# --- Machine corpus (src/data/generate.py; docs/parts-plan.md Stage 3) ---
# python -m src.data.generate --generator qwen7b --buckets en,hi,te,cm --max-minutes 110
# Each human passage gets ONE seen generator: sha256(prompt_id) mod 3 -> slot.
# Each held-out generator takes a disjoint `heldout_share` of passages from a
# second, independent hash, and is test-only (non-negotiable #4).
# See docs/decisions.md 2026-09-13 "Machine text".
machine_corpus:
  output_dir: data/raw/machine
  backend: ollama                   # ollama | hf (fallback: transformers + bitsandbytes 4-bit)
  ollama:
    host: http://127.0.0.1:11434
    parallel: 4                     # concurrent requests; the server needs OLLAMA_NUM_PARALLEL=4 too
    num_ctx: 3072                   # per slot: longest prompt (~700 tokens) + the num_predict cap
    keep_alive: 30m
    request_timeout_s: 900
  decoding: {temperature: 0.8, top_p: 0.95}
  budget:                           # num_predict = requested words x fertility(bucket) x overshoot + pad, capped
    overshoot: 1.3
    pad_tokens: 64
    cap: 2048
    fertility_csv: results/tokenizer_fertility.csv
    fallback_tokenizer: Qwen/Qwen2.5-0.5B   # used when a generator's own tokenizer has no fertility rows
  assignment:
    heldout_share: 0.30             # per held-out generator; the two slices are disjoint
  # `ollama` tags resolve to Q4_K_M where such a tag exists (checked against
  # registry.ollama.ai); the default gemma2:9b and phi3.5:3.8b tags are Q4_0,
  # hence their explicit tags. llama3.1 publishes no -instruct or -q4_K_M tag,
  # so llama uses the plain llama3.1:8b (the locally pulled one).
  # `tokenizer` is the HF repo whose tokenizer the GGUF carries (fertility budget).
  generators:
    qwen7b:  {role: seen,    slot: 0, ollama: "qwen2.5:7b-instruct",              hf: "Qwen/Qwen2.5-7B-Instruct",           tokenizer: "Qwen/Qwen2.5-7B-Instruct"}
    gemma:   {role: seen,    slot: 1, ollama: "gemma2:9b-instruct-q4_K_M",        hf: "google/gemma-2-9b-it",               tokenizer: "google/gemma-2-9b-it"}
    mistral: {role: seen,    slot: 2, ollama: "mistral:7b-instruct",              hf: "mistralai/Mistral-7B-Instruct-v0.3", tokenizer: "mistralai/Mistral-7B-Instruct-v0.3"}
    llama:   {role: heldout, slot: 0, ollama: "llama3.1:8b",                     hf: "meta-llama/Llama-3.1-8B-Instruct",   tokenizer: "meta-llama/Llama-3.1-8B-Instruct"}
    phi:     {role: heldout, slot: 1, ollama: "phi3.5:3.8b-mini-instruct-q4_K_M", hf: "microsoft/Phi-3.5-mini-instruct",    tokenizer: "microsoft/Phi-3.5-mini-instruct"}
