# Data / corpus configuration.

buckets: [en, hi, te, cm]

# Frozen split (non-negotiable #6): written once, never regenerated.
splits_file: data/processed/splits.json

# --- Frozen corpus (src/data/freeze_splits.py; parts-plan Part 13, review2-sprint Day 1) ---
# python -m src.data.freeze_splits --config configs/data.yaml [--dry-run]
# Per bucket: clean (clean_artifacts.py) -> length-match machine to the human
# word-count distribution -> cal_human_per_bucket human rows to `cal` (only from
# calibration-eligible sources) -> every remaining row by its prompt group,
# train_share to train and the rest to test. Held-out generators: test only.
corpus:
  version: v1
  path: data/processed/corpus.jsonl
  generators: [qwen7b]              # v1 is qwen7b only; gemma/mistral join after Review-2
  seed: 20260924
  length_bins: 5                    # quantile bins of the bucket's train/test human word counts
  # Which side length-matching trims (decisions.md 2026-09-24, Part 13). The
  # distributions must match; which side is cut is set by where the surplus is.
  # en/hi/te: human train/test is the surplus, so it is cut to the machine
  # distribution and every clean machine row is kept. cm: the human side cannot
  # be cut without disturbing the cal-eligibility routing, so machine is cut to
  # the train/test human distribution. `cal` is drawn BEFORE matching and is
  # never trimmed.
  length_match_trim: {en: human, hi: human, te: human, cm: machine}
  cal_human_per_bucket: 1000
  train_share: 0.5
  min_rows_per_side: 500            # a bucket below this on the human OR machine side aborts the freeze
  discarded_dir: data/raw/discarded
  length_tokenizer: ai-forever/mGPT # fills length_tokens with the Head B scorer's tokenizer

# Minimum human counts per bucket (locked §5).
min_human_calibration_per_bucket: 1000
min_human_train_test_per_bucket: 1500

# Held-outs (non-negotiable #4): unseen generator(s) + 1 domain, test only.
# Locked 2026-09-13 at 2 generators (llama, phi); phi dropped entirely
# 2026-09-28 (three of its four buckets failed structurally — decisions.md),
# leaving llama as the sole held-out generator. T3 now measures generalisation
# to one unseen model, not a family of them; see decisions.md for the cost.
heldout_generators: [llama]   # aliases from machine_corpus.generators below
heldout_domain: null

# Adversarial attack families (matches RAID/DetectRL practice).
attack_types: [clean, paraphrase, back_translation, hybrid]

# Writer L1/L2 bands for the fairness audit (T5).
writer_l1_bands: [general, indian, native, unknown]   # en: general = L1 proxy, indian = Indian-English (L2 proxy); hi/te/cm: native

# Per-sample schema (docs/project-context-master.md §6).
schema_fields:
  - id
  - text
  - label
  - language
  - code_mix_ratio
  - generator
  - domain
  - length_tokens
  - attack_type
  - writer_L1_band
  - split

sources:
  benchmarks:
    - m4gt_bench      # primary multilingual
    - raid            # adversarial subsets
    - hc3             # smoke tests
  human:
    - indiccorp
    - ai4bharat_catalog
    - hinge
    - comi_lingua
    - l3cube
    - indian_student_essays
    - toefl_l2

# --- Human corpus builder (src/data/build_human_corpus.py; docs/parts-plan.md Parts 1-3) ---
# python -m src.data.build_human_corpus --bucket en --target 2200 --config configs/data.yaml
# Sources per band are pulled in order; max_share caps one source's slice of the
# band target so later sources still contribute. All en sources are pre-2022.
human_corpus:
  output_dir: data/raw/human
  passage_words: {min: 120, max: 300}       # one passage per source doc, cut at a sentence boundary
  # Every source is calibration_eligible unless it says otherwise. A source that
  # is NOT eligible is barred from the `cal` split by freeze_splits and routed to
  # train/test: the conformal guarantee is only as good as the certainty that the
  # calibration text is human (see decisions.md 2026-09-13).
  calibration_eligible_default: true
  dedup: {num_perm: 128, threshold: 0.8, shingle_words: 5}   # MinHash LSH over word 5-grams
  buckets:
    en:
      bands:
        general:            # general human English (L1 proxy for the T5 fairness split)
          share: 0.5
          sources:
            - name: hc3
              max_share: 0.55
              subsets: [reddit_eli5, open_qa, wiki_csai]
              provenance: "HC3 human answers (Guo et al. 2023; Hello-SimpleAI/HC3): ELI5 Reddit 2011-2019, WikiQA 2015, Wikipedia CS/AI intros <=2022; CC-BY-SA-4.0"
            - name: wikipedia
              max_share: 1.0
              config: 20231101.en
              max_page_id: 2000000        # page ids <= 2M were created before mid-2005 (pre-2020 proxy; text as of the 2023-11-01 dump)
              domain: wiki_general
              provenance: "wikimedia/wikipedia 20231101.en, page id <= 2,000,000 (article created <= 2005); CC-BY-SA-4.0"
        indian:             # Indian-English writers (L2 proxy for the T5 fairness split)
          share: 0.5
          sources:
            - name: samanantar_en
              max_share: 1.0
              configs: [hi]               # English side of the en-hi pairs (10.1M rows)
              domain: news_gov_mixed
              provenance: "ai4bharat/samanantar v0.3 (2021), English side of en-hi pairs: shuffled sentences from Indian news / PIB / PMIndia <=2020, regrouped into passages; CC-BY-NC-4.0"
    # hi / te: first-language writers, so a single band. IndicCorpV2 is capped
    # at 0.75 of the bucket so wikipedia contributes the remaining ~25%: that
    # gives hi/te a news + encyclopedic mix instead of pure news, which keeps
    # the domain profile closer to en's and stops a per-bucket result from
    # being partly a domain artefact. `script` keeps the bucket monolingual,
    # which per-language calibration depends on.
    hi:
      bands:
        native:
          share: 1.0
          sources:
            - name: indiccorp_v2
              max_share: 0.75           # leave ~25% of the bucket for wikipedia (domain blend)
              split: hin_Deva           # NOT a per-language config: one config, language = split
              max_docs: 120000          # only ~7% of docs yield a 120-300 word passage
              script: deva
              min_script_ratio: 0.8
              domain: news_web
              provenance: "ai4bharat/IndicCorpV2 (Doddapaneni et al., ACL 2023), split hin_Deva: crawled Indian news/web Hindi, crawl <=2022; CC-0"
            - name: wikipedia
              max_share: 1.0
              config: 20231101.hi
              max_page_id: 100000       # early-created articles (pre-2020 proxy)
              script: deva
              min_script_ratio: 0.8
              domain: wiki_general
              provenance: "wikimedia/wikipedia 20231101.hi, page id <= 100,000; CC-BY-SA-4.0"
    te:
      bands:
        native:
          share: 1.0
          sources:
            - name: indiccorp_v2
              max_share: 0.75           # leave ~25% of the bucket for wikipedia (domain blend)
              split: tel_Telu
              max_docs: 400000          # only ~2% of Telugu docs are long enough
              script: telu
              min_script_ratio: 0.8
              domain: news_web
              provenance: "ai4bharat/IndicCorpV2 (Doddapaneni et al., ACL 2023), split tel_Telu: crawled Indian news/web Telugu, crawl <=2022; CC-0"
            - name: wikipedia
              max_share: 1.0
              config: 20231101.te
              max_page_id: 100000
              script: telu
              min_script_ratio: 0.8
              domain: wiki_general
              provenance: "wikimedia/wikipedia 20231101.te, page id <= 100,000; CC-BY-SA-4.0"
    # cm: Romanised (Latin-script) Hindi-English code-mixing. Hinglish occurs as
    # comments, chat turns and single sentences, so this bucket overrides the
    # global passage length - a 120-word floor would reject nearly all of it.
    # `min_hindi_word_ratio` is the bucket's real gate: it separates genuine
    # code-mixing from the English-only rows that sit in the same source files,
    # and its value is stored per row as `code_mix_ratio`.
    cm:
      passage_words: {min: 15, max: 300}
      bands:
        native:
          share: 1.0
          sources:
            # Pre-ChatGPT sources first, so as much of the bucket as possible
            # has provenance that rules out machine text (see decisions.md).
            - name: hinge
              max_share: 1.0
              split: train
              column: "Human-generated Hinglish"
              script: latn
              min_script_ratio: 0.9
              min_hindi_word_ratio: 0.3
              domain: hinglish_generation
              provenance: "LingoIITGN/HinGE (Srivastava & Singh, 2021): human-written Hinglish for Hindi-English sentence pairs, pre-ChatGPT; CC-BY-4.0"
            - name: cmu_hinglish_dog
              max_share: 1.0
              splits: [train, validation, test]
              script: latn
              min_script_ratio: 0.9
              min_hindi_word_ratio: 0.3
              domain: chat_dialogue
              provenance: "festvox/cmu_hinglish_dog (Zhou et al. 2018; Hinglish version 2020): two-person chat about film articles, utterances joined per conversation, pre-ChatGPT; CC-BY-SA-3.0"
            - name: comi_lingua
              max_share: 1.0
              calibration_eligible: false   # no stated collection date -> cannot rule out machine text
              config: TN              # the only Roman-script config; others are Devanagari
              splits: [train, test]
              column: Sentences       # raw comment, NOT the annotator-normalised columns
              script: latn
              min_script_ratio: 0.9
              min_hindi_word_ratio: 0.3
              domain: social_comments
              provenance: "LingoIITGN/COMI-LINGUA (Sheth et al., 2025) TN config, raw Sentences: naturally-written Roman-script Hinglish social comments; collection date not stated, so post-2022 machine text cannot be ruled out; CC-BY-4.0"

# --- Machine corpus (src/data/generate.py; docs/parts-plan.md Stage 3) ---
# python -m src.data.generate --generator qwen7b --buckets en,hi,te,cm --max-minutes 110
# Each human passage gets ONE seen generator: sha256(prompt_id) mod 3 -> slot.
# Each held-out generator takes a disjoint `heldout_share` of passages from a
# second, independent hash, and is test-only (non-negotiable #4).
# See docs/decisions.md 2026-09-13 "Machine text".
machine_corpus:
  output_dir: data/raw/machine
  backend: ollama                   # ollama | hf (fallback: transformers + bitsandbytes 4-bit)
  ollama:
    host: http://127.0.0.1:11434
    parallel: 4                     # concurrent requests; the server needs OLLAMA_NUM_PARALLEL=4 too.
                                    # gemma2:9b at Q4_K_M may need 2 on an 8 GB card (decisions.md
                                    # 2026-09-13 section 2); generate.py halves this automatically
                                    # if the load reports out of memory.
    num_ctx: 4608                   # per slot: longest prompt (~900 tokens) + the 3600 num_predict cap
    keep_alive: 30m
    request_timeout_s: 900
  decoding: {temperature: 0.8, top_p: 0.95}
  budget:                           # num_predict = HUMAN words x fertility(bucket) x overshoot + pad, capped
    overshoot: 1.5
    pad_tokens: 128
    cap: 3600                       # 3600 / 11.919 tokens-per-word holds ~302 Telugu words
    # Measured machine/human word ratio under each bucket's OWN template; the prompt
    # asks for human_words / ratio, clamped to what the cap can hold. te 0.62 is
    # measured under the "indic" template - the 0.31 figure came from the old plain
    # one, and compensating that on top of the new framing would double-count.
    # Every value measured on that bucket's own probe before generating, never
    # carried across by analogy (decisions.md 2026-09-18). The ratio only ever
    # inflates the ask, so a bucket that over-produces is fixed by its template,
    # not here: hi is on the plain template at 0.55 for exactly that reason.
    compliance_ratio: {en: 1.0, hi: 0.55, te: 0.62, cm: 1.0}
    # The map above is the SHARED DEFAULT for every generator; the one below
    # overrides it per generator, and a generator absent from it resolves
    # exactly as before (qwen7b's frozen rows are unaffected).
    #
    # A ratio is the fraction of the ask that ONE model writes in ONE bucket, so
    # it never transfers between models. Everything above was measured on qwen
    # and then handed to gemma unchanged: gemma writes longer on Indic and
    # shorter on English (en 0.80 vs qwen 0.87), so hi 0.55 inflated its ask
    # x1.8 and its 24 gate-probe rows came out at 1.51 of human length, outside
    # [0.75, 1.25]. decisions.md 2026-09-18 required per-probe measurement; this
    # key is what makes the config able to express it (2026-09-23).
    # gemma measured 2026-09-23 on its own 12-passage probe per bucket, current
    # templates, ask = bin, no compensation (src/data/probe_compliance.py):
    #   hi 0.73 (mean 0.74, p10 0.60, p90 0.87) against qwen's 0.55
    #   te 0.84 (mean 0.79, p10 0.58, p90 0.93) against qwen's 0.62
    # Both are machine/ask, the convention every value in compliance_ratio uses.
    # en and cm are absent on purpose: gemma's en passed its gate at 0.80 and cm
    # at 1.00 under the shared defaults, so there is nothing to correct.
    compliance_ratio_by_generator:
      gemma:   {hi: 0.73, te: 0.84}
      # mistral measured 2026-09-24, same probe method: hi 0.88 (mean 0.94,
      # p10 0.77, p90 1.19), writing close to the ask. No te entry — mistral
      # does not generate te at all (drop_buckets_by_generator below).
      mistral: {hi: 0.88}
      # llama measured 2026-09-28, same probe method: hi 0.61 (mean 0.62,
      # p10 0.44, p90 0.81), te 0.52 (mean 0.66, p10 0.26, p90 1.09, 1/12 at
      # cap — a lower bound), cm 1.17 (mean 1.51) already close to human at
      # ask = bin with no compensation. llama is the sole held-out generator
      # (decisions.md 2026-09-28, phi dropped entirely) and cleared its raw
      # 12-row probe on all three buckets it carries.
      llama: {hi: 0.61, te: 0.52, cm: 1.17}
    # cm asks from the human passage's own length, not its bin, and inflates only
    # passages of 40+ words (ask = human / 0.75); compliance_ratio is not applied to
    # it. Probed 2026-09-21: 0-40 at 1.19, 40+ at 1.09 (docs/progress.md).
    ask_from_human: {cm: {long_from_words: 40, long_ratio: 0.75}}
    fertility_csv: results/tokenizer_fertility.csv
    fallback_tokenizer: Qwen/Qwen2.5-0.5B   # used when a generator's own tokenizer has no fertility rows
  # Abort gate (decisions.md 2026-09-19). Each bucket is taken to `probe_rows`
  # rows and judged before the rest of it is generated: the median machine/human
  # word ratio must be inside [ratio_min, ratio_max] and at most `max_cap_pct` of
  # rows may have hit the token cap. BOTH ratio bounds are tested - failing only
  # below 0.75 is what let a cm run reach 470 rows at 1.88 of human length. Rows
  # already on disk count towards the probe, so a resume judges what is there.
  gate:
    probe_rows: 24
    ratio_min: 0.75
    ratio_max: 1.25
    max_cap_pct: 20
    # Code-mix check (docs/progress.md 2026-09-21): for these buckets the probe
    # rows' median romanised-Hindi function-word share must be at least
    # codemix_min_ratio of the same passages' human text. Length alone passed
    # 701 cm rows at the English floor (0.02-0.04 against a human 0.30-0.33).
    codemix_buckets: [cm]
    codemix_min_ratio: 0.667
    # Emoji check (2026-09-22): one probe row with an emoji fails these buckets.
    # The human cm bucket has emoji in 0 of 2,200 rows.
    emoji_buckets: [cm]
  assignment:
    heldout_share: 0.30             # per held-out generator; the two slices are disjoint
  # Per-bucket cap on passages PER GENERATOR. Indic decoding is the cost driver:
  # for Qwen's tokenizer te runs 11.919 tokens/word and hi 4.804, against
  # English's 1.339 (mGPT, the scorer, sees 6.319 / 3.560 / 1.363). Full
  # assignments in those buckets dominate generation time. Each cap is selected
  # stratified across the human length bins and the chosen ids are frozen under
  # selection_dir (decisions.md 2026-09-18). Generators keep DISJOINT passages:
  # the shared-panel alternative was declined because it breaks the
  # one-seen-generator-per-passage rule of decisions.md section 3.
  bucket_limits: {te: 400, hi: 500}
  # Per-generator override of the caps above. A COMPUTE constraint, not a
  # statistical one: measured 2026-09-23, gemma decodes hi at ~10 tok/s against
  # qwen's ~40 on this card, so a full 500/400 assignment for gemma and mistral
  # would cost days of wall-clock each. qwen keeps 500/400 — already generated,
  # and its rows are frozen. Across the three seen generators this still leaves
  # ~1,150 hi and ~1,000 te machine rows, well above what calibration needs.
  # Changing a cap here requires archiving that generator's selection record;
  # generate.py aborts rather than reusing a record frozen at the old limit.
  bucket_limits_by_generator:
    gemma:   {hi: 250, te: 200}
    mistral: {hi: 250, te: 200}
  # Buckets a HELD-OUT generator skips entirely. llama is test-only and exists
  # to prove unseen-generator generalisation (non-negotiable #4); hi, te and cm
  # carry that test, and en is already the best-covered bucket in the corpus,
  # so generating it twice more buys nothing (decisions.md 2026-09-23). phi was
  # also held-out but is dropped entirely as a generator (decisions.md
  # 2026-09-28); llama is now the sole held-out generator. Keyed on the role,
  # so it follows a generator whose role changes.
  heldout_drop_buckets: [en]
  # Buckets a NAMED generator does not generate, whatever its role. Separate
  # from heldout_drop_buckets because the reason is the model, not the role.
  #
  # mistral / te: mistral's tokenizer reads Telugu at 13.309 tokens/word against
  # gemma's 4.942, so a 3600-token budget holds ~270 Telugu words and EVERY te
  # ask pins at the cap regardless of passage length. Length-matching is
  # impossible when the budget, not the passage, sets the length — no template
  # and no compliance ratio reaches it. Measured the same day, mistral also
  # over-produced te at 1.65x human under both templates. te is covered by
  # qwen (400) and gemma (200) instead: 600 rows across two seen generators.
  # Generator coverage per bucket is reported, not required to be uniform
  # (decisions.md 2026-09-24).
  # phi is no longer a generator at all (dropped 2026-09-28, decisions.md):
  # three of its four buckets failed structurally (cm instruction compliance,
  # te cap-pinning at 20.3 tok/word, hi a 1.47x over-production no ratio can
  # correct), leaving only one usable bucket out of four. llama covers hi, te
  # and cm cleanly on its own raw-compliance probe, so llama alone carries
  # held-out generalisation (non-negotiable #4) rather than spending a sitting
  # fixing phi's template for one bucket.
  drop_buckets_by_generator:
    mistral: [te]
  selection_dir: data/processed/selection
  # `ollama` tags resolve to Q4_K_M where such a tag exists (checked against
  # registry.ollama.ai); the default gemma2:9b tag is Q4_0, hence its explicit
  # tag. llama3.1 publishes no -instruct or -q4_K_M tag, so llama uses the
  # plain llama3.1:8b (the locally pulled one).
  # `tokenizer` is the HF repo whose tokenizer the GGUF carries (fertility budget).
  # phi (phi3.5:3.8b-mini-instruct-q4_K_M) was held-out slot 1 and is dropped
  # entirely as of 2026-09-28 — three of its four buckets failed structurally;
  # see decisions.md. llama is now the sole held-out generator.
  generators:
    qwen7b:  {role: seen,    slot: 0, ollama: "qwen2.5:7b-instruct",              hf: "Qwen/Qwen2.5-7B-Instruct",           tokenizer: "Qwen/Qwen2.5-7B-Instruct"}
    gemma:   {role: seen,    slot: 1, ollama: "gemma2:9b-instruct-q4_K_M",        hf: "google/gemma-2-9b-it",               tokenizer: "google/gemma-2-9b-it"}
    mistral: {role: seen,    slot: 2, ollama: "mistral:7b-instruct",              hf: "mistralai/Mistral-7B-Instruct-v0.3", tokenizer: "mistralai/Mistral-7B-Instruct-v0.3"}
    llama:   {role: heldout, slot: 0, ollama: "llama3.1:8b",                     hf: "meta-llama/Llama-3.1-8B-Instruct",   tokenizer: "meta-llama/Llama-3.1-8B-Instruct"}
