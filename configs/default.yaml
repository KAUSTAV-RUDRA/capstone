# Default configuration. Every script takes --config; nothing hardcodes paths.
project: mgt-detect
seed: 42
device: cpu            # cpu | cuda

# Four language buckets = four separate calibrations (non-negotiable #1, #3).
buckets: [en, hi, te, cm]

# Target false-positive rates for the conformal thresholds (locked §5).
alpha: [0.01, 0.05]

paths:
  data_raw: data/raw
  data_processed: data/processed
  splits: data/processed/splits.json     # FROZEN once written (non-negotiable #6)
  results: results
  models_cache: data/models
  logs: results/logs

heads:
  stylometric: true      # Head A
  curvature: true        # Head B
  semantic: false        # Head C: only when VRAM >= 8GB (see models.yaml)

fusion:
  method: logistic       # logistic first; gbm only if it wins on cal AUROC

calibration:
  method: split_conformal
  temperature_scaling: true
  min_calibration_per_bucket: 1000       # conformal quantile unstable below ~500

abstention:
  enabled: true          # three-way HUMAN | ABSTAIN | MACHINE (non-negotiable #3)

logging:
  level: INFO
