# Model configuration.

# Head B scorer: LOCKED 2026-09-13 on measured tokenizer fertility
# (results/tokenizer_fertility.csv, scripts/tokenizer_fertility.py).
#
#   tokens/word   en      hi      te       cm
#   mGPT          1.363   3.560   6.319    1.714
#   Qwen2.5-0.5B  1.339   4.804  11.919    1.672
#
# The two are equivalent on en and cm, but Qwen needs 1.9x as many tokens per
# Telugu word and 1.35x per Hindi word. Curvature is computed from per-token
# log-probabilities, so that fragmentation directly degrades the Head B signal
# in exactly the buckets this project exists to cover. Fallback is kept for
# hosts where mGPT-1.3B does not fit; using it costs Indic sensitivity.
scorer_model: "ai-forever/mGPT"
scorer_model_fallback: "Qwen/Qwen2.5-0.5B"

# Head C encoder (MuRIL): encoder-only, embeddings ONLY, never curvature
# (non-negotiable #9). Used only if VRAM >= head_c_vram_threshold_gb.
semantic_model: "google/muril-base-cased"

# Supervised baseline (XLM-R). No fine-tuning above 2B params (non-negotiable #5).
supervised_baseline: "xlm-roberta-base"

# Perturbation model for the DetectGPT baseline.
perturbation_model: "google/mt5-small"

load_in_8bit: false      # set true to fit the 4GB VRAM floor
max_length: 512
device: cpu

# Hardware gates (non-negotiable #5).
vram_floor_gb: 4
head_c_vram_threshold_gb: 7.5   # GiB, matching scripts/check_hardware.py: an "8 GB" card is 7.9956 GiB

# Machine-text generators live in configs/data.yaml under machine_corpus.generators
# (one registry, read by src/data/generate.py): seen = qwen7b, gemma, mistral;
# held-out, TEST ONLY (non-negotiable #4) = llama, phi. All via local Ollama, Q4_K_M.
